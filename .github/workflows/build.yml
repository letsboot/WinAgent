name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install mingw-w64 (i686)
        run: sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq gcc-mingw-w64-i686

      - name: Build and check WINAGENT.EXE
        run: ./build.sh

      - name: No OpenRouter key in repo or exe
        run: |
          if grep -rIn --exclude-dir=.git --exclude-dir=build -E 'sk-or-v1-[0-9a-f]{16}' . || grep -a -q 'sk-or-' dist/WINAGENT.EXE; then
            echo "OpenRouter key found" >&2; exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: WINAGENT
          path: dist/

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/WINAGENT.EXE
            dist/WINAGENT.EXE.sha256
          generate_release_notes: true
